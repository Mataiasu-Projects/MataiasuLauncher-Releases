name: Guardian — Cleanup workflow runs

on:
  workflow_dispatch:
  # Scheduled runs are paused until this repository is granted access to the private reusable workflow in Project-Guardian.

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    uses: Mataiasu-Projects/Project-Guardian/.github/workflows/cleanup-workflow-runs.yml@main
    with:
      keep-successful: 10
      include-skipped: true
